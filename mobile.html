<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayala Foundation</title>
<meta name="description" content="Building thriving communities toward shared prosperity. Explore the Ayala Foundation’s programs in Community Development, Arts and Culture, Leadership Development and Education.">
<meta name="theme-color" content="#0322B1">
<link rel="icon" href="assets/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="assets/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ayala Foundation">
<meta property="og:title" content="Ayala Foundation">
<meta property="og:description" content="Building thriving communities toward shared prosperity. Explore the Ayala Foundation’s programs in Community Development, Arts and Culture, Leadership Development and Education.">
<meta property="og:url" content="https://svcict.github.io/projectlobby/mobile.html">
<meta property="og:image" content="https://svcict.github.io/projectlobby/assets/link-preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Ayala Foundation logo beside a photo of two Iraya Mangyan weavers">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="assets/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="mobile.css?v=8aa5cb5476">
</head>
<body>
<div class="page">
<div class="sheet">

  <header class="top">
    <button class="u press top__back" id="back" aria-label="Back" hidden>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#0322B1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="top__title" id="barTitle"></div>
  </header>

  <!-- Home -->
  <section class="view view--home" data-view="home" hidden>
    <div class="m-logo"><h1 class="sr-only">Ayala Foundation</h1><div class="slot slot--contain" data-src="assets/logo.webp" data-ph="Ayala Foundation logo"></div></div>
    <a class="m-slides" href="#pillars">
      <div class="m-slide"><div class="slot" data-priority data-src="assets/m/community-card.webp" data-ph="Community Development photo"></div></div>
      <div class="m-slide"><div class="slot" data-defer data-src="assets/m/arts-card.webp" data-ph="Arts and Culture photo"></div></div>
      <div class="m-slide"><div class="slot" data-defer data-src="assets/m/leadership-card.webp" data-ph="Leadership Development photo"></div></div>
      <div class="m-slide"><div class="slot" data-defer data-src="assets/m/bigbets-card.webp" data-ph="Education photo"></div></div>
      <div class="m-tagline">
        <h2 class="m-tagline__title" data-t="homeTitle"></h2>
        <p class="m-tagline__line" data-t="homeLine"></p>
      </div>
      <div class="m-slides__foot">
        <span class="m-slides__name" id="slideName"></span>
        <div class="m-dots"><div class="m-dot"></div><div class="m-dot"></div><div class="m-dot"></div><div class="m-dot"></div></div>
      </div>
    </a>
    <a class="u press m-cta" href="#pillars">
      <span class="m-cta__label" data-t="mobileCta"></span>
      <span class="m-cta__go"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="#F0781E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
  </section>

  <!-- Our pillars -->
  <section class="view view--programs" data-view="programs" hidden>
    <div class="m-head">
      <div class="m-accent"></div>
      <h1 class="m-h1" data-t="allTitle"></h1>
      <p class="m-text" data-t="pillarsIntro"></p>
    </div>
    <a class="u press m-card" href="#community">
      <div class="m-card__media"><div class="slot" data-src="assets/m/community-card.webp" data-ph="Community Development image"></div></div>
      <div class="m-card__body">
        <div class="m-card__text"><span class="m-tag" data-t="tagPillar"></span><span class="m-card__name" data-t="p3"></span><span class="m-card__desc" data-t="d3"></span></div>
        <span class="m-go" data-icon="go"></span>
      </div>
    </a>
    <a class="u press m-card" href="#arts">
      <div class="m-card__media"><div class="slot" data-src="assets/m/arts-card.webp" data-ph="Arts and Culture image"></div></div>
      <div class="m-card__body">
        <div class="m-card__text"><span class="m-tag" data-t="tagPillar"></span><span class="m-card__name" data-t="p0"></span><span class="m-card__desc" data-t="d0"></span></div>
        <span class="m-go" data-icon="go"></span>
      </div>
    </a>
    <a class="u press m-card" href="#leadership">
      <div class="m-card__media"><div class="slot" data-src="assets/m/leadership-card.webp" data-ph="Leadership Development image"></div></div>
      <div class="m-card__body">
        <div class="m-card__text"><span class="m-tag" data-t="tagPillar"></span><span class="m-card__name" data-t="p1"></span><span class="m-card__desc" data-t="d1"></span></div>
        <span class="m-go" data-icon="go"></span>
      </div>
    </a>
    <a class="u press m-card" href="#bigbets">
      <div class="m-card__media"><div class="slot" data-src="assets/m/bigbets-card.webp" data-ph="Education image"></div></div>
      <div class="m-card__body">
        <div class="m-card__text"><span class="m-tag m-tag--bet" data-t="tagBet"></span><span class="m-card__name" data-t="p2"></span><span class="m-card__desc" data-t="d2"></span></div>
        <span class="m-go" data-icon="go"></span>
      </div>
    </a>
    <a class="u press m-support" href="#program/ccv">
      <span class="m-support__text">
        <span class="m-support__label" data-t="supportedBy"></span>
        <span class="m-support__name" data-t="ccvName"></span>
        <span class="m-support__line" data-t="ccvLine"></span>
      </span>
      <span class="m-go" data-icon="go"></span>
    </a>
  </section>

  <!-- Pillar page: Arts and Culture, Leadership Development, Education or Community Development -->
  <section class="view" data-view="program" hidden>
    <div class="m-hero m-hero--wide">
      <div class="slot" data-for-prog="arts" data-src="assets/m/arts-card.webp" data-ph="Hero photo — artist at work"></div>
      <div class="slot" data-for-prog="leadership" data-src="assets/m/leadership-card.webp" data-ph="Leadership Development hero image"></div>
      <div class="slot" data-for-prog="bigbets" data-src="assets/m/bigbets-card.webp" data-ph="Education hero photo"></div>
      <div class="slot" data-for-prog="community" data-src="assets/m/community-card.webp" data-ph="Community Development hero photo"></div>
    </div>
    <div class="m-band">
      <div class="m-eyebrow" data-pg="tag"></div>
      <h1 class="m-title" data-pg="title"></h1>
      <p class="m-band__body" data-pg="body"></p>
    </div>
    <div class="m-content">
      <div class="m-group">
        <h2 class="m-h2" data-t="projects"></h2>
        <!-- Built from programs.js: every program under the pillar on screen. -->
        <div class="m-projects" id="projectList"></div>
      </div>
      <div class="m-group">
        <h2 class="m-h2" data-t="partOf"></h2>
        <div class="pj-contact">
          <div class="pj-contact__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0322B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></svg></div>
          <div class="pj-contact__text">
            <div class="pj-contact__lines">
              <a class="pj-contact__link" href="mailto:partnerships@ayalafoundation.org">partnerships@ayalafoundation.org</a>
              <a class="pj-contact__link" href="https://www.ayalafoundation.org" target="_blank" rel="noopener">www.ayalafoundation.org</a>
            </div>
          </div>
        </div>
      </div>
      <div class="m-group">
        <h2 class="m-h2" data-t="more"></h2>
        <!-- The tile for the pillar on screen is hidden. -->
        <div class="m-tiles">
          <a class="u press m-tile" href="#community" data-tile="community">
            <div class="m-tile__media"><div class="slot" data-src="assets/community-tile.jpg" data-ph="Community photo"></div></div>
            <div class="m-tile__name" data-t="p3"></div>
          </a>
          <a class="u press m-tile" href="#arts" data-tile="arts">
            <div class="m-tile__media"><div class="slot" data-src="assets/arts-tile.jpg" data-ph="Arts and Culture image"></div></div>
            <div class="m-tile__name" data-t="p0"></div>
          </a>
          <a class="u press m-tile" href="#leadership" data-tile="leadership">
            <div class="m-tile__media"><div class="slot" data-src="assets/leadership-tile.jpg" data-ph="Leadership illustration"></div></div>
            <div class="m-tile__name" data-t="p1"></div>
          </a>
          <a class="u press m-tile" href="#bigbets" data-tile="bigbets">
            <div class="m-tile__media"><div class="slot" data-src="assets/bigbets-tile.jpg" data-ph="Education illustration"></div></div>
            <div class="m-tile__name" data-t="p2"></div>
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- Program page: one layout for every program in programs.js -->
  <section class="view" data-view="project" hidden>
    <div class="m-hero m-hero--wide" id="pjHeroes"></div>
    <div class="m-band" id="pjIntro"></div>
    <div class="m-content m-content--project">
      <div class="m-stack" id="pjBody"></div>
      <!-- Same tabs as the kiosk; sticks under the header while scrolling. -->
      <div class="m-tabs" id="pjTabs" hidden><div class="m-tabs__bar" role="tablist"></div></div>
      <div id="pjSections" class="m-sections"></div>
      <div class="pj-contact" id="pjContact"></div>
    </div>
  </section>

  <!-- Opened from a lobby QR code (?from=lobby): confirm the page is theirs to keep. -->
  <div class="m-saved" id="fromLobby" role="status" hidden>
    <span class="m-saved__icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    <span class="m-saved__text" data-t="fromLobby"></span>
    <button class="u m-saved__close" id="fromLobbyClose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>

</div>
</div>
<script src="copy.js?v=5444ad1a98"></script>
<script src="programs.js?v=383c3bff77"></script>
<script src="project-view.js?v=e59e9c0843"></script>
<script src="analytics.js?v=559a7bfa88"></script>
<script src="mobile.js?v=973c070f20"></script>
</body>
</html>
