<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayala Foundation</title>
<script>
  // Phones and tablets get the phone page (the QR codes link there directly
  // too). The lobby TV is a touchscreen as well, but much larger.
  // Add ?kiosk to the address to always show the kiosk.
  try {
    const short = Math.min(window.innerWidth, window.innerHeight), long = Math.max(window.innerWidth, window.innerHeight);
    const touchTablet = window.matchMedia('(pointer: coarse)').matches && long < 1280;
    const forced = new URLSearchParams(location.search).has('kiosk');
    if (window.top === window && !forced && (short < 600 || touchTablet)) location.replace('mobile.html' + location.hash);
  } catch (_) {}
</script>
<link rel="preload" href="assets/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css?v=20261019082348">
</head>
<body>
<div class="viewport">
<div class="stage" id="stage">

  <!-- Pillar page (base layer): Arts and Culture, Leadership Development, Education or Community Development -->
  <div class="screen screen--program" data-screen="program">
    <aside class="panel">
      <div class="panel__media">
        <div class="hero-layer" data-hero="arts"><div class="slot" data-src="assets/arts-card.jpg" data-ph="Hero photo — artist at work"></div></div>
        <div class="hero-layer" data-hero="leadership"><div class="slot" data-src="assets/leadership-card.jpg" data-ph="Leadership Development hero image"></div></div>
        <div class="hero-layer" data-hero="bigbets"><div class="slot" data-src="assets/bigbets-card.jpg" data-ph="Education hero photo"></div></div>
        <div class="hero-layer" data-hero="community"><div class="slot" data-src="assets/community-card.jpg" data-ph="Community Development hero photo"></div></div>
      </div>
      <div class="panel__text">
        <div class="eyebrow" data-pg="tag"></div>
        <h1 class="program-title" data-pg="title"></h1>
        <p class="program-body" data-pg="body"></p>
      </div>
    </aside>

    <main class="program-main">
      <section class="section">
        <h2 class="h2" data-t="projects"></h2>
        <!-- Built from programs.js: every program under the pillar on screen. -->
        <div class="projects" id="projectList"></div>
      </section>

      <section class="section">
        <h2 class="h2" data-t="partOf"></h2>
        <div class="join">
          <div class="pj-contact join__partner">
            <div class="pj-contact__icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0322B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></svg></div>
            <div class="pj-contact__text">
              <div class="pj-contact__lines"><span>partnerships@ayalafoundation.org</span><span>www.ayalafoundation.org</span></div>
            </div>
          </div>
          <div class="take">
            <div class="take__qr">
              <div class="slot slot--contain" data-for-prog="arts" data-src="assets/qr-arts.png" data-ph="QR code"></div>
              <div class="slot slot--contain" data-for-prog="leadership" data-src="assets/qr-leadership.png" data-ph="QR code"></div>
              <div class="slot slot--contain" data-for-prog="bigbets" data-src="assets/qr-bigbets.png" data-ph="QR code"></div>
              <div class="slot slot--contain" data-for-prog="community" data-src="assets/qr-community.png" data-ph="QR code"></div>
            </div>
            <div class="take__text">
              <div class="take__title" data-t="take"></div>
              <div class="take__body" data-t="takeBody"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- The tile for the pillar on screen is hidden, leaving three. -->
      <section class="section section--fill">
        <h2 class="h2" data-t="more"></h2>
        <div class="tiles">
          <button class="u press tile" data-tile="community" data-action="open-prog" data-prog="community">
            <div class="tile__media"><div class="slot" data-src="assets/community-tile.jpg" data-ph="Community photo"></div></div>
            <div class="tile__label"><span class="tile__name" data-t="p3"></span><span data-icon="chevron-white-22"></span></div>
          </button>
          <button class="u press tile" data-tile="arts" data-action="open-prog" data-prog="arts">
            <div class="tile__media"><div class="slot" data-src="assets/arts-tile.jpg" data-ph="Arts and Culture image"></div></div>
            <div class="tile__label"><span class="tile__name" data-t="p0"></span><span data-icon="chevron-white-22"></span></div>
          </button>
          <button class="u press tile" data-tile="leadership" data-action="open-prog" data-prog="leadership">
            <div class="tile__media"><div class="slot" data-src="assets/leadership-tile.jpg" data-ph="Leadership illustration"></div></div>
            <div class="tile__label"><span class="tile__name" data-t="p1"></span><span data-icon="chevron-white-22"></span></div>
          </button>
          <button class="u press tile" data-tile="bigbets" data-action="open-prog" data-prog="bigbets">
            <div class="tile__media"><div class="slot" data-src="assets/bigbets-tile.jpg" data-ph="Education illustration"></div></div>
            <div class="tile__label"><span class="tile__name" data-t="p2"></span><span data-icon="chevron-white-22"></span></div>
          </button>
        </div>
      </section>
    </main>

    <nav class="bar bar--light">
      <button class="u press btn-primary" data-action="all-programs"><span data-icon="grid"></span><span data-t="allPrograms"></span></button>
      <div class="bar__side bar__side--end"><div class="lang" data-lang-switch></div></div>
    </nav>
  </div>

  <!-- Program page: one layout for every program in programs.js -->
  <div class="screen screen--project" data-screen="project">
    <aside class="panel">
      <div class="panel__media" id="pjHeroes"></div>
      <div class="panel__text" id="pjIntro"></div>
    </aside>
    <main class="pj-main">
      <div class="tabs" id="pjTabs" role="tablist"></div>
      <div class="pj-panels" id="pjPanels"></div>
      <div class="pj-contact" id="pjContact"></div>
    </main>
    <nav class="bar bar--light">
      <div class="bar__side">
        <button class="u press btn-primary" data-action="all-programs"><span data-icon="grid"></span><span data-t="allPrograms"></span></button>
        <button class="u press btn-ghost" data-action="project-back"><span data-icon="back"></span><span id="pjBackLabel"></span></button>
      </div>
      <div class="bar__side bar__side--end"><div class="lang" data-lang-switch></div></div>
    </nav>
  </div>

  <!-- Home -->
  <div class="screen screen--home" data-screen="home">
    <section class="home-intro" data-action="explore-start">
      <div class="home-logo-wrap">
        <h1 class="home-logo"><span class="sr-only">Ayala Foundation</span><div class="slot slot--contain" data-src="assets/logo.webp" data-ph="Ayala Foundation logo"></div></h1>
      </div>
      <button class="u press touch" data-action="explore-start">
        <span class="touch__label" data-t="touch"></span>
        <span class="touch__go" data-icon="chevron-orange-30"></span>
      </button>
    </section>
    <div class="home-photos" data-action="explore-start">
      <div class="slide"><div class="slot" data-src="assets/community-card.jpg" data-ph="Community Development photo"></div></div>
      <div class="slide"><div class="slot" data-src="assets/arts-card.jpg" data-ph="Arts and Culture photo"></div></div>
      <div class="slide"><div class="slot" data-src="assets/leadership-card.jpg" data-ph="Leadership Development photo"></div></div>
      <div class="slide"><div class="slot" data-src="assets/bigbets-card.jpg" data-ph="Education photo"></div></div>
      <div class="home-tagline">
        <h2 class="home-tagline__title" data-t="homeTitle"></h2>
        <p class="home-tagline__line" data-t="homeLine"></p>
      </div>
      <!-- One real figure per pillar, changing with the photo (filled from copy.js). -->
      <div class="home-stats" id="homeStats" aria-live="off"></div>
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>
    <nav class="bar bar--end">
      <div class="lang" data-lang-switch></div>
    </nav>
  </div>

  <!-- Our pillars -->
  <div class="screen screen--programs" data-screen="programs">
    <section class="programs">
      <div class="programs__head">
        <div class="programs__heading">
          <div class="accent"></div>
          <h1 class="programs__title" data-t="allTitle"></h1>
        </div>
        <p class="programs__intro" data-t="pillarsIntro"></p>
      </div>
      <div class="track" id="track">
        <div class="card" data-card="0"><div class="card__face"><div class="slot" data-src="assets/community-card.jpg" data-ph="Community Development image"></div></div></div>
        <div class="card" data-card="1"><div class="card__face"><div class="slot" data-src="assets/arts-card.jpg" data-ph="Arts and Culture image"></div></div></div>
        <div class="card" data-card="2"><div class="card__face"><div class="slot" data-src="assets/leadership-card.jpg" data-ph="Leadership Development image"></div></div></div>
        <div class="card" data-card="3"><div class="card__face"><div class="slot" data-src="assets/bigbets-card.jpg" data-ph="Education image"></div></div></div>
        <button class="u arrow arrow--prev" data-action="prev" aria-label="Previous pillar"><span data-icon="back-blue-32"></span></button>
        <button class="u arrow arrow--next" data-action="next" aria-label="Next pillar"><span data-icon="chevron-blue-32"></span></button>
      </div>
      <div class="programs__copy" id="programsCopy">
        <span class="programs__tag" id="curTag"></span>
        <h2 class="programs__name" id="curName"></h2>
        <p class="programs__desc" id="curDesc"></p>
      </div>
      <div class="programs__cta">
        <button class="u press explore" data-action="explore"><span id="exploreLabel"></span><span data-icon="chevron-white-26"></span></button>
      </div>
    </section>
    <nav class="bar">
      <div class="bar__side">
        <button class="u press btn-ghost" data-action="start-over"><span data-icon="home"></span><span data-t="home"></span></button>
        <button class="u press btn-ghost" data-action="about"><span data-icon="info"></span><span data-t="about"></span></button>
      </div>
      <!-- Corporate Citizenship and Volunteerism supports every pillar, so it sits under them rather than in the row. -->
      <button class="u press support" data-action="open-project" data-project="ccv">
        <span class="support__label" data-t="supportedBy"></span>
        <span class="support__text"><span class="support__name" data-t="ccvName"></span><span class="support__line" data-t="ccvLine"></span></span>
        <span class="support__go" data-icon="chevron-blue-32"></span>
      </button>
      <div class="lang" data-lang-switch></div>
    </nav>
  </div>

  <!-- "Still there?" warning, above every screen -->
  <!-- Shown for two seconds when a visit ends, before Home returns. -->
  <div class="farewell" id="farewell" aria-hidden="true">
    <div class="farewell__logo"><div class="slot slot--contain" data-src="assets/logo.webp" data-ph="Ayala Foundation logo"></div></div>
    <div class="farewell__text" data-t="thanks"></div>
  </div>

  <div class="idle" id="idle" data-idle-modal aria-hidden="true">
    <div class="idle__box" role="dialog" aria-modal="true" aria-labelledby="idleTitle">
      <div class="idle__title" id="idleTitle" data-t="still"></div>
      <div class="idle__body"><span data-t="stillBody"></span> <strong id="idleCount">15</strong></div>
      <div class="idle__actions">
        <button class="u press idle__btn" data-action="end-visit" data-t="startOver"></button>
        <button class="u press idle__btn idle__btn--primary" data-action="keep-going" data-t="keep"></button>
      </div>
      <div class="idle__bar" id="idleBar"></div>
    </div>
  </div>

</div>
</div>
<script src="copy.js?v=20261019082348"></script>
<script src="programs.js?v=20261019082348"></script>
<script src="project-view.js?v=20261019082348"></script>
<script src="app.js?v=20261019082348"></script>
</body>
</html>
